services:
  backend:
    build:
      context: .
      target: backend
    # Na VPS, crie backend/.env com SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
    # JWT_SECRET e CORS_ORIGIN (a URL pública do site, ex.: https://seudominio.com).
    env_file: backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3333/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      target: frontend
    # A porta 80 do host já está em uso (proxy reverso de outros projetos na
    # VPS) — publica em 8080 e o nginx/proxy do host deve rotear o domínio
    # da Aldeia para 127.0.0.1:8080.
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
